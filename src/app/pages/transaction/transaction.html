<app-navbar></app-navbar>
<div class="container">
  <!-- HEADER -->
  <div class="header">

    <div class="actions">
      <h2 class="page-title">Transaction</h2>
    </div>

    <div class="filters">
      <span>Total : <strong>{{transactions.length}}</strong></span>
      <input type="text" placeholder="Rechercher ici..." [(ngModel)]="search">
    </div>
  </div>
<div class="card">
  <!-- TABLE -->
  <div class="table">
    <div class="table-header">
      <div></div>
      <div>DATE</div>
      <div>LIBELLÉ</div>
      <div>MONTANT</div>
      <div>CATÉGORIE</div>
    </div>

    <div class="table-row" *ngFor="let t of transactions">
      <div><input type="checkbox"></div>
      <div>{{t.dateTransaction}}</div>
      <div>{{t.description}}</div>
      <div [ngClass]="{'debit': t.typeOperation === 'DEBIT', 'credit': t.typeOperation === 'CREDIT'}">
        {{t.montant}}
      </div>

      <div>
        <select>
          <option>{{t.sousCategorie}}</option>
        </select>
      </div>
    </div>
  </div>

<button class="btn-add" mat-raised-button color="primary" (click)="openAddTransactionDialog()">
  Ajouter Transaction
</button>

</div>

</div>
