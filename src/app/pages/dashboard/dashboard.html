<app-navbar></app-navbar>
<div class="dashboard">

  <h2 class="page-title">Dashboard</h2>

  <!-- Summary Cards -->
  <div class="cards">
    <div class="card">
      <span class="card-label">Solde actuel: </span>
      <span class="card-value">{{ summary.soldeActuel | number }} MAD</span>
    </div>
    <div class="card">
      <span class="card-label">Encaissements du mois: </span>
      <span class="card-value income">{{ summary.encaissementsMois | number }} MAD</span>
    </div>
    <div class="card">
      <span class="card-label">Décaissements du mois: </span>
      <span class="card-value expense">{{ summary.decaissementsMois | number }} MAD</span>
    </div>
    <div class="card">
      <span class="card-label">Score de santé: </span>
      <span class="card-value score">{{ summary.healthScore }} / 100</span>
    </div>
  </div>

  <!-- Charts -->
  <div class="charts">
    <div class="chart-card">
      <h3>Aperçu mensuel</h3>
      <div echarts [options]="barOptions" class="chart"></div>
    </div>
    <div class="chart-card">
      <h3>Prévision 90 jours</h3>
      <div echarts [options]="lineOptions" class="chart"></div>
    </div>
  </div>

</div>
